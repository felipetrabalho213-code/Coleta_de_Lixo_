name: meu_abastecimento
description: "Aplicativo Segue Coleta"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  table_calendar: ^3.1.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.5.0
  image_picker: ^1.2.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icone.png"
  min_sdk_android: 21